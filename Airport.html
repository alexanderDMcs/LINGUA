<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torre de Control · Historia de los Aeropuertos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mulish:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>/* ===== Tokens ===== */
:root{
  --dawn: #FFD9A0;
  --sky: #6EC6FF;
  --dusk: #7B6DB8;
  --night: #101B33;
  --ink: #0F1B33;
  --cloud: #FFFFFF;
  --paper: #F4F8FC;
  --amber: #FFAE34;
  --amber-dark: #E8931A;
  --taxiway: #2FCC71;
  --taxiway-dark: #1EA85A;
  --locked: #B9C3D4;
  --locked-line: #D3DAE6;
  --shadow: rgba(16,27,51,.18);
  --display: "Baloo 2", system-ui, sans-serif;
  --body: "Mulish", system-ui, sans-serif;
  --mono: "Space Mono", monospace;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--body);
  color:var(--ink);
  background:var(--paper);
  min-height:100vh;
  overflow-x:hidden;
}

/* ===== Ambient sky background, shifts dawn -> night on scroll ===== */
.sky-layer{
  position:fixed;
  inset:0;
  z-index:-2;
  background:linear-gradient(180deg, var(--dawn) 0%, var(--sky) 45%, var(--dusk) 75%, var(--night) 100%);
  transition:filter .2s linear;
}
.stars{position:absolute;inset:0;opacity:0;transition:opacity .4s ease;}
.stars::before{
  content:"";
  position:absolute;inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 20%, #fff 100%, transparent),
    radial-gradient(1.5px 1.5px at 60% 10%, #fff 100%, transparent),
    radial-gradient(1px 1px at 80% 30%, #fff 100%, transparent),
    radial-gradient(1.5px 1.5px at 40% 60%, #fff 100%, transparent),
    radial-gradient(1px 1px at 90% 70%, #fff 100%, transparent),
    radial-gradient(1.5px 1.5px at 10% 80%, #fff 100%, transparent);
  background-repeat:repeat;
  background-size:400px 600px;
}
.cloud{
  position:absolute;
  width:140px;height:44px;
  background:rgba(255,255,255,.65);
  border-radius:100px;
  filter:blur(1px);
}
.cloud::before,.cloud::after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:100px;
}
.cloud::before{width:70px;height:70px;top:-30px;left:15px;}
.cloud::after{width:50px;height:50px;top:-20px;left:70px;}
.c1{top:8%; left:6%;}
.c2{top:18%; right:10%; transform:scale(.7);}
.c3{top:30%; left:35%; transform:scale(.55);}

/* ===== Top bar ===== */
.topbar{
  position:sticky; top:0; z-index:30;
  backdrop-filter:blur(10px);
  background:rgba(255,255,255,.55);
  border-bottom:1px solid rgba(16,27,51,.08);
}
.topbar-inner{
  max-width:720px; margin:0 auto;
  display:flex; align-items:center; gap:16px;
  padding:12px 20px;
}
.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--display); font-weight:700; font-size:15px;
  color:var(--ink); white-space:nowrap;
}
.brand-icon{color:var(--amber-dark);}
.progress-track{
  position:relative;
  flex:1; height:12px;
  background:var(--locked-line);
  border-radius:20px;
  overflow:visible;
}
.progress-fill{
  height:100%; width:0%;
  background:linear-gradient(90deg, var(--taxiway-dark), var(--taxiway));
  border-radius:20px;
  transition:width .5s cubic-bezier(.4,1.4,.6,1);
}
.progress-plane{
  position:absolute; top:50%; left:0%;
  transform:translate(-50%,-50%) rotate(90deg);
  color:var(--amber-dark);
  transition:left .5s cubic-bezier(.4,1.4,.6,1);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));
}
.reset-btn{
  border:none; background:transparent;
  font-family:var(--body); font-weight:700; font-size:12px;
  color:var(--ink); opacity:.55; cursor:pointer;
  padding:6px 8px; border-radius:8px;
  white-space:nowrap;
}
.reset-btn:hover{opacity:1; background:rgba(16,27,51,.06);}

/* ===== Hero ===== */
.hero{
  max-width:640px; margin:0 auto;
  text-align:center;
  padding:64px 24px 40px;
}
.hero-eyebrow{
  font-family:var(--mono);
  letter-spacing:.14em; text-transform:uppercase;
  font-size:12px; font-weight:700;
  color:var(--ink); opacity:.6;
  margin:0 0 14px;
}
.hero h1{
  font-family:var(--display);
  font-weight:800;
  font-size:clamp(34px, 6vw, 52px);
  line-height:1.05;
  margin:0 0 18px;
  color:var(--ink);
}
.hero-sub{
  font-size:16px; line-height:1.6;
  color:rgba(15,27,51,.75);
  max-width:480px; margin:0 auto 28px;
}
.btn-primary{
  font-family:var(--display); font-weight:700; font-size:16px;
  color:#fff;
  background:var(--taxiway-dark);
  border:none; border-bottom:4px solid #16824A;
  padding:14px 28px;
  border-radius:16px;
  cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.05);
  transition:transform .08s ease, filter .15s ease;
}
.btn-primary:hover{filter:brightness(1.06);}
.btn-primary:active{transform:translateY(3px); border-bottom-width:1px;}
.btn-primary:disabled{background:var(--locked); border-color:#9AA6BA; cursor:not-allowed;}

/* ===== Path ===== */
.path{
  position:relative;
  max-width:640px; margin:0 auto;
  padding:20px 24px 140px;
  display:flex; flex-direction:column;
  gap:46px;
}
.node-row{
  display:flex; position:relative;
}
.node-row::before{
  content:"";
  position:absolute;
  left:50%; top:-46px;
  width:0; height:46px;
  border-left:4px dashed rgba(16,27,51,.28);
  transform:translateX(-50%);
}
.node-row:first-child::before{display:none;}
.node-row.p-center{justify-content:center;}
.node-row.p-right{justify-content:flex-end; padding-right:8%;}
.node-row.p-left{justify-content:flex-start; padding-left:8%;}
.node-row.p-mid-right{justify-content:center; transform:translateX(18%);}
.node-row.p-mid-left{justify-content:center; transform:translateX(-18%);}

.node{
  position:relative;
  width:84px; height:84px;
  border-radius:50%;
  border:none;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  background:var(--locked);
  box-shadow:0 6px 0 var(--locked-line);
  color:#fff;
  transition:transform .1s ease;
  flex-shrink:0;
}
.node:active{transform:translateY(4px);}
.node svg{width:34px; height:34px;}
.node .lock-icon{width:26px;height:26px;}

.node.current{
  background:var(--amber);
  box-shadow:0 6px 0 var(--amber-dark);
  animation:pulse 2.2s ease-in-out infinite;
}
.node.done{
  background:var(--taxiway);
  box-shadow:0 6px 0 var(--taxiway-dark);
}
.node.locked{cursor:not-allowed;}

@keyframes pulse{
  0%,100%{ box-shadow:0 6px 0 var(--amber-dark), 0 0 0 0 rgba(255,174,52,.45); }
  50%{ box-shadow:0 6px 0 var(--amber-dark), 0 0 0 10px rgba(255,174,52,0); }
}

.node-label{
  position:absolute;
  top:100%; left:50%;
  transform:translateX(-50%);
  margin-top:8px;
  font-family:var(--mono);
  font-size:11px; font-weight:700;
  letter-spacing:.03em;
  color:var(--ink); opacity:.65;
  white-space:nowrap;
  background:rgba(255,255,255,.7);
  padding:2px 8px;
  border-radius:8px;
}

.quiz-node{
  background:var(--ink) !important;
  box-shadow:0 6px 0 #060c1c !important;
}

/* ===== Overlay + panels ===== */
.overlay{
  position:fixed; inset:0;
  background:rgba(10,16,30,.5);
  opacity:0; pointer-events:none;
  transition:opacity .25s ease;
  z-index:40;
}
.overlay.show{opacity:1; pointer-events:auto;}

.lesson-panel{
  position:fixed;
  left:0; right:0; bottom:0;
  z-index:50;
  background:var(--cloud);
  border-radius:24px 24px 0 0;
  max-width:640px; margin:0 auto;
  transform:translateY(105%);
  transition:transform .32s cubic-bezier(.32,.9,.4,1);
  box-shadow:0 -10px 40px var(--shadow);
  max-height:85vh;
  overflow-y:auto;
}
.lesson-panel.show{transform:translateY(0);}
.lesson-panel-inner{
  padding:22px 26px 30px;
  position:relative;
}
.close-btn{
  position:absolute; top:16px; right:18px;
  border:none; background:rgba(16,27,51,.06);
  width:32px; height:32px; border-radius:50%;
  font-size:14px; cursor:pointer;
  color:var(--ink);
}

/* Split-flap departure board for the year */
.board{
  display:inline-flex;
  gap:4px;
  margin:6px 0 18px;
}
.board span{
  font-family:var(--mono); font-weight:700; font-size:20px;
  background:#12182B; color:#FFC24D;
  padding:6px 8px;
  border-radius:5px;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.06);
  min-width:16px; text-align:center;
}

.lesson-title{
  font-family:var(--display); font-weight:700;
  font-size:22px; margin:0 0 10px;
  color:var(--ink);
  padding-right:30px;
}
.lesson-text{
  font-size:16px; line-height:1.7;
  color:rgba(15,27,51,.85);
  margin:0 0 24px;
}

/* ===== Quiz ===== */
.quiz-progress{
  font-family:var(--mono); font-size:12px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase;
  color:rgba(15,27,51,.5);
  margin:6px 0 6px;
}
.quiz-options{
  display:flex; flex-direction:column; gap:10px;
  margin-bottom:16px;
}
.quiz-option{
  text-align:left;
  font-family:var(--body); font-weight:700; font-size:15px;
  padding:14px 16px;
  border-radius:12px;
  border:2px solid var(--locked-line);
  background:#fff;
  cursor:pointer;
  color:var(--ink);
  transition:background .15s ease, border-color .15s ease;
}
.quiz-option:hover{border-color:var(--sky);}
.quiz-option.correct{border-color:var(--taxiway-dark); background:rgba(47,204,113,.12);}
.quiz-option.wrong{border-color:#E85D5D; background:rgba(232,93,93,.1);}
.quiz-option[disabled]{cursor:default;}
.quiz-feedback{
  font-size:14px; font-weight:700;
  min-height:20px;
  margin-bottom:14px;
}
.quiz-feedback.correct{color:var(--taxiway-dark);}
.quiz-feedback.wrong{color:#C74545;}

.done-inner{text-align:center;}
.done-icon{color:var(--taxiway-dark); margin-bottom:10px;}

/* ===== Responsive ===== */
@media (max-width:480px){
  .hero{padding:48px 18px 30px;}
  .path{padding:16px 12px 120px;}
  .node{width:72px; height:72px;}
  .node svg{width:28px; height:28px;}
  .node-row.p-right{padding-right:2%;}
  .node-row.p-left{padding-left:2%;}
  .node-row.p-mid-right{transform:translateX(10%);}
  .node-row.p-mid-left{transform:translateX(-10%);}
}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important;}
  html{scroll-behavior:auto;}
}

/* Keyboard focus visibility */
button:focus-visible{
  outline:3px solid var(--sky);
  outline-offset:2px;
}</style>
</head>
<body>

</svg>

<div class="sky-layer" id="skyLayer" aria-hidden="true">
  <div class="stars" id="stars"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22"><use href="#icon-tower"></use></svg>
      <span>Torre de Control</span>
    </div>
    <div class="progress-track" role="progressbar" aria-label="Progreso de la lección" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
      <svg class="progress-plane" id="progressPlane" viewBox="0 0 24 24" width="20" height="20"><use href="#icon-plane-nose"></use></svg>
    </div>
    <button class="reset-btn" id="resetBtn" title="Reiniciar progreso">Reiniciar</button>
  </div>
</header>

<main>
  <section class="hero">
    <p class="hero-eyebrow">Ruta de vuelo · 12 escalas</p>
    <h1>Historia de los<br>Aeropuertos</h1>
    <p class="hero-sub">Desde un potrero abierto hasta una terminal con control biométrico. Recorré la línea de tiempo, escala por escala, y despegá con el examen final.</p>
    <button class="btn-primary" id="startBtn">Empezar el recorrido</button>
  </section>

  <div class="path" id="path"></div>
</main>

<!-- Lesson panel -->
<div class="overlay" id="overlay"></div>
<section class="lesson-panel" id="lessonPanel" aria-hidden="true">
  <div class="lesson-panel-inner">
    <button class="close-btn" id="closeBtn" aria-label="Cerrar">✕</button>
    <div class="board" id="board"></div>
    <h2 class="lesson-title" id="lessonTitle"></h2>
    <p class="lesson-text" id="lessonText"></p>
    <button class="btn-primary" id="continueBtn">Marcar como completada</button>
  </div>
</section>

<!-- Quiz panel -->
<section class="lesson-panel" id="quizPanel" aria-hidden="true">
  <div class="lesson-panel-inner">
    <button class="close-btn" id="quizCloseBtn" aria-label="Cerrar">✕</button>
    <p class="quiz-progress" id="quizProgress"></p>
    <h2 class="lesson-title" id="quizQuestion"></h2>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <button class="btn-primary" id="quizNextBtn" disabled>Siguiente</button>
  </div>
</section>

<!-- Completion screen -->
<section class="lesson-panel" id="donePanel" aria-hidden="true">
  <div class="lesson-panel-inner done-inner">
    <svg viewBox="0 0 24 24" width="56" height="56" class="done-icon"><use href="#icon-check"></use></svg>
    <h2 class="lesson-title">¡Aterrizaje completo!</h2>
    <p class="lesson-text" id="doneScore"></p>
    <button class="btn-primary" id="doneCloseBtn">Volver a la ruta</button>
  </div>
</section>

<script>/* ============================================================
   Data: contenido tal como fue provisto, dividido en 12 escalas
   ============================================================ */
const LESSONS = [
  {
    id: 1, year: "—", icon: "icon-field",
    title: "Antes de los aeropuertos",
    text: "The history of airports began with the first airplanes. At first, airplanes did not need airports like the ones we have today. Pilots used large, open fields to take off and land."
  },
  {
    id: 2, year: "1903", icon: "icon-biplane",
    title: "El primer despegue",
    text: "One important moment happened in 1903. The Wright brothers made one of the first successful flights with a motor-powered airplane. This helped aviation grow, and people started to need special places for airplanes."
  },
  {
    id: 3, year: "1909", icon: "icon-tower",
    title: "College Park Airport",
    text: "In 1909, College Park Airport opened in the United States. It was used for military activities and training. It is one of the oldest airports still operating today."
  },
  {
    id: 4, year: "1914", icon: "icon-shield",
    title: "Primera Guerra Mundial",
    text: "During World War I, from 1914 to 1918, airplanes became more common. They were used for military missions, so more airfields were built."
  },
  {
    id: 5, year: "1920s", icon: "icon-mail",
    title: "Correo y pasajeros",
    text: "After the war, during the 1920s and 1930s, airplanes started to carry people and mail. Airports became more organized. They had hangars, small buildings, and better places for airplanes to land."
  },
  {
    id: 6, year: "1930s", icon: "icon-route",
    title: "El auge de las aerolíneas",
    text: "As airlines became more popular, airports also became bigger. They were no longer just places for airplanes. They became places where people could travel from one city to another."
  },
  {
    id: 7, year: "1939", icon: "icon-radar",
    title: "Segunda Guerra Mundial",
    text: "During World War II, from 1939 to 1945, aviation developed very quickly. Airports got longer runways and better navigation systems."
  },
  {
    id: 8, year: "1950s", icon: "icon-jet",
    title: "La era del jet",
    text: "In the 1950s, jet airplanes changed air travel. They were faster and bigger, so airports needed longer runways and larger terminals."
  },
  {
    id: 9, year: "1960s", icon: "icon-suitcase",
    title: "Nuevas zonas del aeropuerto",
    text: "During the 1960s and 1970s, airports continued to grow. They started to have security areas, boarding areas, luggage areas, restaurants, and stores."
  },
  {
    id: 10, year: "1980s", icon: "icon-skyline",
    title: "Centros de transporte",
    text: "In the 1980s and 1990s, airports became very large transportation centers. Some had hotels, parking areas, and connections with buses and trains. Computers also helped manage flights and passengers."
  },
  {
    id: 11, year: "2000s", icon: "icon-chip",
    title: "Tecnología del siglo XXI",
    text: "In the 21st century, airports use more technology. They have modern security systems, digital screens, biometric controls, and automatic machines."
  },
  {
    id: 12, year: "Hoy", icon: "icon-globe",
    title: "Aeropuertos de hoy",
    text: "Today, airports are very important because they connect cities and countries. They have changed a lot since the first airplanes, from simple open fields to large and modern transportation centers."
  },
];

const QUIZ = [
  {
    q: "¿En qué año hicieron los hermanos Wright uno de los primeros vuelos exitosos con motor?",
    options: ["1899", "1903", "1914", "1927"],
    correct: 1
  },
  {
    q: "¿Para qué se usaba College Park Airport cuando abrió en 1909?",
    options: ["Turismo internacional", "Actividades y entrenamiento militar", "Correo postal", "Vuelos comerciales de pasajeros"],
    correct: 1
  },
  {
    q: "¿Qué años abarcó la Primera Guerra Mundial, según el texto?",
    options: ["1903–1909", "1914–1918", "1939–1945", "1920–1930"],
    correct: 1
  },
  {
    q: "¿Qué cambiaron los aviones a reacción (jets) en los años 50?",
    options: [
      "Hicieron los aeropuertos más pequeños",
      "Los aeropuertos necesitaron pistas más largas y terminales más grandes",
      "Eliminaron la necesidad de pistas",
      "Redujeron el número de pasajeros"
    ],
    correct: 1
  },
  {
    q: "¿Qué zonas empezaron a tener los aeropuertos en los años 60 y 70?",
    options: [
      "Hoteles y casinos",
      "Seguridad, embarque, equipaje, restaurantes y tiendas",
      "Solo hangares militares",
      "Estaciones de tren subterráneas"
    ],
    correct: 1
  },
  {
    q: "Hoy en día, ¿por qué son importantes los aeropuertos según el texto?",
    options: [
      "Porque son las construcciones más antiguas del mundo",
      "Porque conectan ciudades y países",
      "Porque ya no usan tecnología",
      "Porque reemplazaron a los barcos"
    ],
    correct: 1
  }
];

/* ============================================================
   State
   ============================================================ */
const STORAGE_KEY = "airport-history-progress";
let completed = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
let activeLessonId = null;
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;

const positions = ["p-center", "p-right", "p-mid-right", "p-left", "p-mid-left", "p-center"];

/* ============================================================
   Build the path
   ============================================================ */
const pathEl = document.getElementById("path");

function nodeState(lesson, index){
  if (completed.has(lesson.id)) return "done";
  const prevDone = index === 0 || completed.has(LESSONS[index - 1].id);
  return prevDone ? "current" : "locked";
}

function renderPath(){
  pathEl.innerHTML = "";

  LESSONS.forEach((lesson, i) => {
    const row = document.createElement("div");
    row.className = `node-row ${positions[i % positions.length]}`;

    const state = nodeState(lesson, i);
    const btn = document.createElement("button");
    btn.className = `node ${state}`;
    btn.setAttribute("aria-label", `Escala ${lesson.id}: ${lesson.title}`);
    btn.disabled = state === "locked";

    let iconHtml;
    if (state === "done") iconHtml = `<svg><use href="#icon-check"></use></svg>`;
    else if (state === "locked") iconHtml = `<svg class="lock-icon"><use href="#icon-lock"></use></svg>`;
    else iconHtml = `<svg><use href="#${lesson.icon}"></use></svg>`;

    btn.innerHTML = `${iconHtml}<span class="node-label">${lesson.year}</span>`;
    btn.addEventListener("click", () => state !== "locked" && openLesson(lesson.id));

    row.appendChild(btn);
    pathEl.appendChild(row);
  });

  // Quiz node at the end, unlocked once every lesson is done
  const quizRow = document.createElement("div");
  quizRow.className = `node-row ${positions[LESSONS.length % positions.length]}`;
  const allDone = LESSONS.every(l => completed.has(l.id));
  const quizBtn = document.createElement("button");
  quizBtn.className = `node quiz-node ${allDone ? "" : "locked"}`;
  quizBtn.disabled = !allDone;
  quizBtn.setAttribute("aria-label", "Examen final");
  quizBtn.innerHTML = allDone
    ? `<svg><use href="#icon-radar"></use></svg><span class="node-label">EXAMEN</span>`
    : `<svg class="lock-icon"><use href="#icon-lock"></use></svg><span class="node-label">EXAMEN</span>`;
  quizBtn.addEventListener("click", () => allDone && openQuiz());
  quizRow.appendChild(quizBtn);
  pathEl.appendChild(quizRow);

  updateProgress();
}

function updateProgress(){
  const pct = Math.round((completed.size / LESSONS.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressPlane").style.left = pct + "%";
}

function saveProgress(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...completed]));
}

/* ============================================================
   Lesson panel
   ============================================================ */
const overlay = document.getElementById("overlay");
const lessonPanel = document.getElementById("lessonPanel");
const quizPanel = document.getElementById("quizPanel");
const donePanel = document.getElementById("donePanel");

function openLesson(id){
  const lesson = LESSONS.find(l => l.id === id);
  activeLessonId = id;

  document.getElementById("board").innerHTML = lesson.year
    .split("").map(ch => `<span>${ch}</span>`).join("");
  document.getElementById("lessonTitle").textContent = lesson.title;
  document.getElementById("lessonText").textContent = lesson.text;

  const continueBtn = document.getElementById("continueBtn");
  const already = completed.has(id);
  continueBtn.textContent = already ? "Ya completada · continuar" : "Marcar como completada";

  showPanel(lessonPanel);
}

document.getElementById("continueBtn").addEventListener("click", () => {
  completed.add(activeLessonId);
  saveProgress();
  renderPath();
  hidePanel(lessonPanel);
});

document.getElementById("closeBtn").addEventListener("click", () => hidePanel(lessonPanel));

/* ============================================================
   Quiz panel
   ============================================================ */
function openQuiz(){
  quizIndex = 0;
  quizScore = 0;
  renderQuizQuestion();
  showPanel(quizPanel);
}

function renderQuizQuestion(){
  quizAnswered = false;
  const item = QUIZ[quizIndex];
  document.getElementById("quizProgress").textContent = `Pregunta ${quizIndex + 1} de ${QUIZ.length}`;
  document.getElementById("quizQuestion").textContent = item.q;
  document.getElementById("quizFeedback").textContent = "";
  document.getElementById("quizFeedback").className = "quiz-feedback";
  document.getElementById("quizNextBtn").disabled = true;
  document.getElementById("quizNextBtn").textContent =
    quizIndex === QUIZ.length - 1 ? "Ver resultado" : "Siguiente";

  const optionsEl = document.getElementById("quizOptions");
  optionsEl.innerHTML = "";
  item.options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "quiz-option";
    b.textContent = opt;
    b.addEventListener("click", () => selectAnswer(i, b));
    optionsEl.appendChild(b);
  });
}

function selectAnswer(i, btn){
  if (quizAnswered) return;
  quizAnswered = true;
  const item = QUIZ[quizIndex];
  const buttons = document.querySelectorAll(".quiz-option");
  buttons.forEach(b => b.disabled = true);

  const feedback = document.getElementById("quizFeedback");
  if (i === item.correct){
    btn.classList.add("correct");
    feedback.textContent = "¡Correcto!";
    feedback.className = "quiz-feedback correct";
    quizScore++;
  } else {
    btn.classList.add("wrong");
    buttons[item.correct].classList.add("correct");
    feedback.textContent = "No es así — fijate la opción marcada en verde.";
    feedback.className = "quiz-feedback wrong";
  }
  document.getElementById("quizNextBtn").disabled = false;
}

document.getElementById("quizNextBtn").addEventListener("click", () => {
  if (quizIndex < QUIZ.length - 1){
    quizIndex++;
    renderQuizQuestion();
  } else {
    hidePanel(quizPanel);
    document.getElementById("doneScore").textContent =
      `Respondiste bien ${quizScore} de ${QUIZ.length} preguntas.`;
    showPanel(donePanel);
  }
});

document.getElementById("quizCloseBtn").addEventListener("click", () => hidePanel(quizPanel));
document.getElementById("doneCloseBtn").addEventListener("click", () => hidePanel(donePanel));

/* ============================================================
   Panel helpers
   ============================================================ */
function showPanel(panel){
  overlay.classList.add("show");
  panel.classList.add("show");
  panel.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}
function hidePanel(panel){
  overlay.classList.remove("show");
  panel.classList.remove("show");
  panel.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}
overlay.addEventListener("click", () => {
  [lessonPanel, quizPanel, donePanel].forEach(p => hidePanel(p));
});

/* ============================================================
   Misc UI
   ============================================================ */
document.getElementById("startBtn").addEventListener("click", () => {
  document.getElementById("path").scrollIntoView({ behavior: "smooth", block: "start" });
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("¿Reiniciar todo tu progreso?")){
    completed = new Set();
    saveProgress();
    renderPath();
  }
});

/* Ambient sky: dawn -> night as the page scrolls through the timeline */
const starsEl = document.getElementById("stars");
window.addEventListener("scroll", () => {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const p = max > 0 ? window.scrollY / max : 0;
  starsEl.style.opacity = Math.max(0, (p - 0.55) / 0.45);
}, { passive: true });

renderPath();</script>
